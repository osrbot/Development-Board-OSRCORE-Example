name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware binaries
        uses: actions/download-artifact@v4
        with:
          name: firmware-bins
          path: firmware/

      - name: Package all.zip
        run: |
          mkdir -p zip_staging
          for bin in firmware/osrcore-*-full.bin; do
            name=$(basename "$bin")
            # extract dir name by stripping leading "osrcore-" and trailing ".bin"
            dir="${name#osrcore-}"
            dir="${dir%-full.bin}"
            mkdir -p "zip_staging/${dir}"
            cp "$bin" "zip_staging/${dir}/${name}"
          done
          echo "OSRCORE firmware — ${GITHUB_REF_NAME}" > zip_staging/README.txt
          echo "" >> zip_staging/README.txt
          echo "Flash any .bin file at address 0x0:" >> zip_staging/README.txt
          echo "  esptool.py --chip esp32s3 write_flash 0x0 <subdir>/osrcore-<example>-full.bin" >> zip_staging/README.txt
          cd zip_staging
          zip -r ../all.zip . -x "*.DS_Store"
          cd ..

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            BODY=$(git log "${PREV_TAG}..HEAD" --oneline --no-decorate)
          else
            BODY=$(git log --oneline --no-decorate)
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: OSRCORE ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.body }}

            ## Flashing

            `*-full.bin` files are merged (bootloader + partition-table + OTA data + app) images flashable at offset `0x0`.
            `*-app.bin` files are application images for firmware-level OTA update only.

            ```bash
            esptool.py --chip esp32s3 write_flash 0x0 osrcore-<example>-full.bin
            ```

            For browser-based flashing, run the local companion service described in LOCAL_LAB.md. Physical-board validation status is documented in EXAMPLE_REVIEW.md.
          files: |
            firmware/osrcore-*.bin
            firmware/osrbot_ESP32S3_IDF_App.bin
            firmware/osrbot_ESP32S3_IDF_FullFlash.bin
            all.zip
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
