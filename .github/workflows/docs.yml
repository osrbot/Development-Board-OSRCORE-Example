name: Validate and publish lessons
on:
  push:
    branches: [main, refactor/interactive-learning]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firmware:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.server_url == 'https://github.com'
    uses: ./.github/workflows/build.yml
  validate:
    needs: firmware
    if: ${{ !cancelled() && (needs.firmware.result == 'success' || needs.firmware.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: node --test tools/*.test.mjs docs/scripts/*.test.mjs
      - name: Include course firmware
        if: needs.firmware.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: web-*
          merge-multiple: true
          path: docs/public/firmware/
      - run: npm run build
        working-directory: docs
        env:
          OSRCORE_PAGES: 'true'
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.server_url == 'https://github.com'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.server_url == 'https://github.com'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
