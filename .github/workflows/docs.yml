name: Validate interactive lessons
on:
  push:
    branches: [main, refactor/interactive-learning]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm --prefix docs ci
      - run: node --test tools/*.test.mjs docs/scripts/*.test.mjs
      - run: npm --prefix docs run build
