<!doctype html><meta charset="utf-8"><title>OSRCORE CAD asset renderer</title><style>body{margin:0;background:#fff;font:14px sans-serif}canvas{display:block;width:900px!important;height:800px!important}button{padding:10px}#status{padding:10px}</style><div id="status">Loading original EDA model</div><button id="angle">Perspective</button><button id="front">Front</button><button id="back">Back</button><button id="save">Download PNG</button><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'meshoptimizer';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(1800,1600);renderer.setClearColor(0xffffff,0);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;document.body.appendChild(renderer.domElement);
const scene=new T.Scene(),camera=new T.OrthographicCamera(-40.5,40.5,36,-36,.1,500);const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0xb9c9db,1.2));for(const [x,y,z,i] of [[-40,-20,100,2],[40,30,50,1]]){const l=new T.DirectionalLight(0xffffff,i);l.position.set(x,y,z);scene.add(l)}
const gltf=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('/hardware/osrcore.glb');gltf.scene.scale.setScalar(1000);const box=new T.Box3().setFromObject(gltf.scene);const center=box.getCenter(new T.Vector3());gltf.scene.position.sub(center);scene.add(gltf.scene);
gltf.scene.traverse(o=>{if(o.isMesh){for(const m of (Array.isArray(o.material)?o.material:[o.material])){m.roughness=Math.max(.52,m.roughness);m.metalness=Math.min(.45,m.metalness);m.envMapIntensity=.5;if(m.color.g>m.color.r*1.6 && m.color.g>m.color.b*1.4)m.color.set(0x183326);}}});
let current='angle';function render(view){current=view;const wide=view==='angle';renderer.setSize(1800,wide?1100:1600);renderer.domElement.style.cssText=wide?'width:900px!important;height:550px!important':'width:900px!important;height:800px!important';camera.left=wide?-45.8181818:-40.5;camera.right=wide?45.8181818:40.5;camera.top=wide?28:36;camera.bottom=wide?-28:-36;camera.updateProjectionMatrix();camera.up.set(...(view==='angle'?[0,0,1]:[0,1,0]));camera.position.set(...(view==='front'?[0,0,130]:view==='back'?[0,0,-130]:[100,-45,140]));camera.lookAt(0,0,0);camera.updateMatrixWorld();renderer.render(scene,camera);document.querySelector('#status').textContent='Ready: '+view+' · original EDA geometry · '+JSON.stringify(center.toArray());}
for(const v of ['angle','front','back'])document.getElementById(v).onclick=()=>render(v);
document.querySelector('#save').textContent='Save local asset';document.querySelector('#save').onclick=async()=>{await fetch(location.protocol+'//'+location.hostname+':5175',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({view:current,image:renderer.domElement.toDataURL('image/png')})});document.querySelector('#status').textContent='Saved '+current;};render('angle');
</script>
